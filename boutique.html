<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="La boutique Miels du Monde : miels rares d'origine et préparations au miel, analysés en laboratoire français.">
<meta name="theme-color" content="#0b0a08">
<link rel="canonical" href="https://mielsdumonde.fr/boutique/">
<title>Boutique — Miels du Monde</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script defer src="assets/app.js"></script>
</head>
<body>

<header class="pagehead"><div class="glow"></div><div class="shell">
  <div class="crumb"><a href="index.html">Accueil</a> · Boutique</div>
  <h1>La boutique</h1>
  <p>Nos miels rares et nos préparations au miel — chacun importé en direct et analysé en laboratoire français.</p>
</div></header>

<section class="blk"><div class="shell">
  <div class="filters" id="shopFilters">
    <button data-f="all" class="sel">Tout</button>
    <button data-f="miel">Miels d'origine</button>
    <button data-f="prep">Préparations au miel</button>
  </div>
  <div class="card-grid" id="shopGrid"></div>
</div></section>

<section class="blk dark news"><div class="glow"></div><div class="shell">
  <span class="eyebrow center reveal">Le cercle</span>
  <h2 class="reveal st-1" style="font-size:clamp(2.2rem,5vw,3.4rem);margin-top:1rem">Nouvelles récoltes,<br>en avant-première</h2>
  <p class="reveal st-2">Rejoignez le cercle et recevez un code privilège de bienvenue.</p>
  <form class="reveal st-3" id="newsForm"><input type="email" placeholder="Votre adresse e-mail" required aria-label="E-mail"><button class="btn btn-gold" type="submit">Rejoindre</button></form>
</div></section>

<div id="site-footer"></div>
</body>
</html>
