# CORPUS DE FORMULATIONS — le banc d'épreuve de la compréhension.
#
# ═══ AVERTISSEMENT D'HONNÊTETÉ ═══
# `origine: invente` signifie : formulation ÉCRITE PAR MOI, plausible, mais
# JAMAIS OBSERVÉE sur une vraie page. Aucune entrée ne porte `origine: observe`
# tant qu'aucune page réelle n'a été lue. Ce corpus mesure donc ce que le moteur
# comprend de formulations vraisemblables — pas ce qu'il comprendra du réel.
#
# Chaque entrée déclare ce qu'un opérateur humain conclurait, et le niveau de
# certitude qu'il aurait. `attendu: INCONNU` n'est PAS un échec : c'est la bonne
# réponse quand la phrase ne permet pas de trancher.
#
# `dimension` dit sur quoi porte l'épreuve :
#   etat      → B, l'état de procédure
#   nature    → C, fait / signal / hypothèse
#   piege     → la formulation ressemble à une procédure sans en être une
#
# `champ` dit COMMENT le portail présente la phrase. C'est décisif : la même
# phrase n'a pas le même poids selon qu'elle est du texte libre ou la valeur
# d'un champ de statut.
#   texte     → prose de l'annonce (défaut)
#   statut    → la valeur que le portail a mise dans son champ « statut »
# « Sélection en cours » écrit nulle part en particulier n'établit aucune
# procédure ; la même phrase DANS un champ de statut dit qu'il y en a une, dont
# on ne sait pas conclure l'état.

meta:
  origine_par_defaut: invente
  pages_reelles_observees: 0

