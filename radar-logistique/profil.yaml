# Profil de l'entreprise — pilote TOUT le moteur. Séparé du code, modifiable
# sans toucher à une ligne de Python.
#
# Règle : ne JAMAIS inventer une certification, une référence ou une capacité.
# Ce qui n'est pas confirmé porte « A_VERIFIER » — et « A_VERIFIER » ne vaut
# jamais « NON_ELIGIBLE ». Ne pas savoir n'est pas ne pas pouvoir.

entreprise:
  pays: BE
  base: Bruxelles
  anciennete_annees: 1          # jeune : certains marchés exigent 3 ans de comptes
  en_ordre_administratif: true

# ------------------------------------------------------------- capacité --
# Distinction centrale : ce que je possède AUJOURD'HUI n'est pas ce que je peux
# exploiter. Une exigence au-dessus de l'actuel mais sous le maximum mobilisable
# n'est pas un blocage — c'est une réserve.
flotte:
  actuelle:
    - {type: "3.5t",  nombre: 4}
    - {type: "20m3",  nombre: 2}
  extensible_par_location: true
  vehicules_mobilisables_max: 20      # plafond raisonnable sur contrat signé
  delai_mobilisation_jours: 30

chauffeurs:
  actuels: A_VERIFIER
  extensibles: true
  permis: [B]
  chauffeurs_mobilisables_max: 25

depot:
  pays: BE
  ville: Bruxelles
  surface_m2: 400
  tri_colis: true
  stockage_temporaire: true
  froid_positif: A_VERIFIER
  quai_de_dechargement: A_VERIFIER

# ------------------------------------------------------ qualifications --
# Seul ce qui est explicitement confirmé vaut true.
qualifications:
  licences_transport_spf: 2
  agrement_afsca: true
  gdp_pharmaceutique: A_VERIFIER
  assurance_marchandises: A_VERIFIER
  rc_vehicules_confies: A_VERIFIER
  iso: A_VERIFIER

# --------------------------------------------------------- expérience --
# Sert de preuve de référence en marché public. Jamais gonflée.
experience:
  - id: collecte_nl
    intitule: "Collecte quotidienne aux Pays-Bas, acheminement et livraison depuis Bruxelles"
    familles: [transport_international, logistique_entrepot, dernier_kilometre, alimentaire]
    corridor: {collecte: [NL], livraison: [BE]}
    active: true
  - id: meubles
    intitule: "Livraison de meubles à domicile pour un acteur mondial"
    familles: [volumineux, dernier_kilometre]
    corridor: {collecte: [BE], livraison: [BE]}
    active: true

# ------------------------------------------------------------ ciblage --
# Familles d'activité déclarées faisables. Le détail du vocabulaire et des
# exigences typiques vit dans config/capacites.yaml.
familles_actives:
  - logistique_entrepot
  - transport_national
  - transport_international
  - dernier_kilometre
  - alimentaire
  - pharmaceutique          # intéressé, mais exigences à vérifier systématiquement
  - transfert_vehicules
  - lavage_vehicules
  - volumineux
  - gestion_flotte

# Ce qu'on ne prétend pas savoir faire — évite les faux positifs.
familles_exclues:
  - transport_matieres_dangereuses
  - transport_de_personnes
  - demenagement_international_particuliers
