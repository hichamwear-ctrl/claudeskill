# SCORE ADAPTÉ À UNE PME DE TRANSPORT RÉCENTE.
#
# Le score ne dit PAS « plus le marché est gros, mieux c'est ». Il dit
# « quelle est ma probabilité d'aller chercher ce contrat et d'en vivre ».
#
# Il CLASSE, il n'élimine pas : les exigences bloquantes sont traitées ailleurs
# (capacite.py), séparément, exactement comme demandé.

criteres:
  adequation_operationnelle: 25   # est-ce que je sais faire ?
  accessibilite_pme:         20   # une entreprise récente peut-elle concourir ?
  geographie:                15   # compatible avec le modèle Europe → dépôt BE → BE
  taille_adaptee:            15   # à ma capacité — PAS au montant le plus élevé
  recurrence:                10   # un flux régulier vaut mieux qu'une course
  rapidite_demarrage:         8
  rentabilite_potentielle:    7

penalites:
  complexite_investissement: -10  # matériel à louer, personnel à recruter
  concurrence_grands_acteurs: -12 # marché probablement verrouillé
  exigences_non_confirmees:   -8  # par bloc d'inconnues

# ─────────────────────────────────────────────────── taille de contrat visée
# Une cloche, pas une pente : trop petit ne nourrit pas, trop gros exige une
# structure absente. Le sommet est dans la cible économique du profil.
taille:
  mensuel_ideal_min: 5000
  mensuel_ideal_max: 60000
  total_confortable_max: 1500000
  hors_gabarit_au_dela: 3000000
  points_dans_la_cible: 15
  points_proche: 9
  points_hors_cible: 3
  points_hors_gabarit: 0
  points_non_publie: 7            # neutre — jamais pénalisant

# ──────────────────────────────────────────────────────────────── récurrence
recurrence:
  quotidienne: 10
  hebdomadaire: 8
  mensuelle: 6
  pluriannuelle: 8
  ponctuelle: 2
  inconnue: 4

# ────────────────────────────────────────────────────── concurrence probable
# Estimée sur des faits publiés : montant, exigences financières, ancienneté.
concurrence:
  seuil_montant_gros_acteurs: 2000000
  seuil_ca_exige: 1000000
  seuil_anciennete_exigee: 5

# ───────────────────────────────────────── pondération par type d'opportunité
# Un prospect est une inférence, une sous-traitance une hypothèse : ni l'un ni
# l'autre ne doit dominer un marché auquel on peut réellement soumissionner.
facteurs:
  DIRECT: 1.0
  SOUS_TRAITANCE: 0.85
  PROSPECT: 0.7
