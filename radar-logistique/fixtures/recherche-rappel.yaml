#
#  AUCUN DE CES RÉSULTATS N'A ÉTÉ RENDU PAR UN MOTEUR DE RECHERCHE.
#  Aucune de ces adresses n'existe. Ce fichier ne mesure AUCUN marché.
#
#  Il éprouve UNE question : un moteur qui rend peu mais du neuf vaut-il
#  davantage qu'un moteur qui rend beaucoup de déjà-vu ?
#
#    abondant   100 résultats
#    redondant   10 résultats, TOUS déjà vus par « abondant »
#    rare         10 résultats, dont 8 que personne d'autre n'a montrés
#    muet          0 résultat — il a répondu, sans rien trouver
#
#  « muet » n'est PAS « indisponible » : il a été interrogé. Un moteur
#  indisponible ne figure pas ici — il se déclare au registre, et ses
#  résultats sont NON MESURÉS.

