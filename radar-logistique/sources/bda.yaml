# BDA — Bulletin des Adjudications / e-Procurement Belgique
# https://www.publicprocurement.be/bda
#
# C'est la source la PLUS IMPORTANTE pour une PME : elle publie les marchés
# belges y compris sous le seuil européen — communes, CPAS, hôpitaux,
# intercommunales, provinces — dont beaucoup ne paraissent jamais sur TED.
#
# ═══ MÉTHODE : NAVIGATION WEB ═══
# Le BDA n'expose pas d'API JSON connue. On lit donc la page, avec deux règles
# non négociables : le robots.txt est consulté AVANT toute lecture, et le délai
# entre requêtes est respecté.
#
# ═══ verifie: false ═══
# Les sélecteurs ci-dessous sont PLAUSIBLES, PAS MESURÉS. Aucun accès réseau
# depuis l'environnement de développement : la page réelle n'a jamais été vue.
# Ils existent pour être corrigés par la mesure, pas pour être crus.
#
#   python3 outils/collecter_bda.py --pages 5 --sortie bda-brut.json
#   python  -m radar.cli recenser --source bda --echantillon bda-brut.json
#
# Tout champ à 0 % désigne un sélecteur faux. On le corrige ICI, jamais dans le
# code. Puis on passe verifie à true.

source: bda
methode: navigation
verifie: false
secteur_par_defaut: public

navigation:
  base_url: https://www.publicprocurement.be
  url_recherche: https://www.publicprocurement.be/bda
  respecter_robots: true          # jamais désactivable
  agent: "radar-logistique/1.0 (veille de marchés publics)"
  delai_minimum_s: 2.5
  pages_max: 20
  # Paramètres de pagination et de filtre — à confirmer sur la vraie page.
  parametre_page: page
  parametre_recherche: q

  # Le conteneur des résultats, puis une ligne par avis.
  conteneur: {balise: table, attrs: {class: result}}
  ligne:     {balise: tr}

  # Un sélecteur par champ interne. `attribut: texte` par défaut ;
  # `motif` extrait une sous-partie par expression régulière.
  champs:
    identifiant: {balise: td, attrs: {class: reference}}
    intitule:    {balise: a}
    lien_avis:   {balise: a, attribut: href}
    acheteur:    {balise: td, attrs: {class: buyer}}
    echeance:    {balise: td, attrs: {class: deadline}}
    publie_le:   {balise: td, attrs: {class: published}}
    type_avis:   {balise: td, attrs: {class: type}}
    lieu:        {balise: td, attrs: {class: place}}
    cpv:         {balise: td, attrs: {class: cpv}, motif: "([0-9]{8})"}

# La fiche détaillée d'un avis : deuxième requête, une par avis retenu.
detail:
  suivre_le_lien: lien_avis
  champs:
    objet:            {balise: div, attrs: {class: description}}
    montant:          {balise: span, attrs: {class: value}, motif: "([0-9][0-9 .,]*)"}
    duree_mois:       {balise: span, attrs: {class: duration}, motif: "([0-9]+)"}
    plateforme:       {balise: a, attrs: {class: submit}, attribut: href}
    lien_documents:   {balise: a, attrs: {class: documents}, attribut: href}
    contact_email:    {balise: a, attrs: {href: "mailto:"}, attribut: href}
    lots:             {balise: div, attrs: {class: lot}}

# Codes CPV à cibler — à confirmer au recensement, en comptant ceux réellement
# publiés sur douze mois plutôt qu'en les supposant.
cpv_cibles: ["60000000", "60100000", "60160000", "60170000", "63100000",
             "64120000", "98392000", "79620000"]
