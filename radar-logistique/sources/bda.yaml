# Adaptateur BDA / e-Procurement — marchés belges, y compris sous le seuil européen.
#
# verifie: false  →  ces chemins sont PLAUSIBLES, PAS MESURÉS. Aucun accès
# réseau depuis l'environnement de développement : aucune réponse réelle n'a été
# observée. Ils existent pour être corrigés par la mesure, pas pour être crus.
#
#   python -m radar.cli recenser --source ted --echantillon reponses.json
#
# Tout champ à 0 % désigne une clé inexistante. On la corrige ICI, jamais dans
# le code. Puis on passe verifie à true.

source: bda
verifie: false
secteur_par_defaut: public

champs:
  identifiant:      [publication-number, notice-id]
  intitule:         [title.fra, title.nld, title.eng, title]
  type_avis:        [notice-type, form-type]
  acheteur:         [buyer.name.fra, buyer.name.nld, buyer.name, contracting-party.name]
  contact_email:    [buyer.contact.email, contact-email]
  objet:            [description.fra, description.nld, description.eng, short-description]
  montant:          [estimated-value.amount, value-estimated]
  devise:           [estimated-value.currency, currency]
  duree_mois:       [duration-months, contract-duration]
  echeance:         [deadline-receipt-tender, submission-deadline, date-deadline]
  publie_le:        [publication-date, dispatch-date]
  plateforme:       [submission-url, procedure-url]
  lien_documents:   [documents-url, access-url]
  cpv:              [classification-cpv, cpv-main]
  pays:             [place-of-performance.country, country]
  pays_collecte:    [place-of-collection.country]
  pays_livraison:   [place-of-delivery.country, place-of-performance.country]
  lieu:             [place-of-performance.fra, place-of-performance, nuts-code]
  attribue:         [awarded, contract-awarded]
  titulaire:        [winner.name, contractor.name]
  attribue_le:      [award-date, conclusion-date]

# Exigences de sélection. Elles décident de l'éligibilité, donc elles doivent
# venir de champs NORMÉS : une exigence lue en texte libre ne bloque jamais.
  exige_afsca:      [requirements.afsca]
  exige_gdp:        [requirements.gdp]
  exige_froid:      [requirements.temperature-controlled]
  exige_licence:    [requirements.transport-licence]
  surface_min_m2:   [requirements.min-surface-m2]
  vehicules_min:    [requirements.min-vehicles]
  anciennete_min_annees: [requirements.min-years-activity]
  exigences_texte:  [selection-criteria-text]

cpv_cibles:
  - "60000000"
  - "60100000"
  - "60160000"
  - "60170000"
  - "63100000"
  - "64120000"
