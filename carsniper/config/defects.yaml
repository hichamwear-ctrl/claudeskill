  - "slijtage"
  - "lekt"                # 17
  - "lek"
  - "lekkage"
  - "te vervangen"        # 40
  - "moet vervangen"
  - "vervangen worden"
  - "probleem"
  - "problemen"
  - "storing"             # 21
  - "storingen"
  - "geluid"              # 66  "koppeling maakt geluid"
