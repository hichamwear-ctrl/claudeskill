    # AUCUN composant neutre : "pare-choc" ne doit jamais suffire.
    components_fr: []
    components_nl: []
    faults_fr: [accidente, accidentee, vendu accidente, vendue accidentee,
                degats, degat, sinistre, epave, voiture accidentee,
                # "pare-choc" est une piece : ne doit jamais valoir accident
                "re:(?<!pare-)(?<!pare )\\bchoc (avant|arriere)\\b"]
    faults_nl:
      # \w*schade\w* SAUF "schadevrij…" (= SANS dommage) et les composés
      # traités par d'autres codes (motorschade → engine, lakschade → cosmetic).
      - "re:\\b(?!schadevrij)(?!motorschade)(?!lakschade)(?!hagelschade)(?!gebruiksschade)(?!waterschade)(?!turboschade)(?!koppelingsschade)(?!bakschade)(?!koppakkingschade)\\w*schade\\w*\\b(?!\\s*vrij)"
      # "ongeval vrij" en deux mots = SANS accident
      - "re:\\bongeval(?!\\s*vrij)\\w*\\b"
      - "aanrijding"
      - "total loss"
      - "totalloss"
    market_discount: [2000, 8000]
    pro_cost: [600, 5000]
    risk_penalty: 25
    checklist:
      - "Mesurer les jeux de capot/portes et comparer les teintes de peinture"
      - "Contrôler les longerons et les points de soudure sous le tapis"
      - "Vérifier au marbre si le châssis a été touché : là, on ne rattrape pas"

