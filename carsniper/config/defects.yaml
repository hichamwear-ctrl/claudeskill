# CAR SNIPER — lexique des défauts (v2)
#
# CHANGEMENT DE FOND PAR RAPPORT À v1
# ───────────────────────────────────
# v1 cherchait des NOMS DE PIÈCES. "airco" déclenchait un défaut de
# climatisation alors que le mot signifie que la voiture EN EST ÉQUIPÉE.
# 47 % des défauts détectés étaient de ce type.
#
# v2 distingue deux natures de termes :
#
#   components_*  le nom d'un organe. NEUTRE tout seul. Ne devient un défaut
#                 que si un marqueur de panne (fault_markers) apparaît dans
#                 la MÊME proposition.
#                   "airco"                        → rien
#                   "airco kapot"                  → défaut
#
#   faults_*      une formulation qui EST un défaut à elle seule.
#                   "motorschade"                  → défaut
#                   "koppeling versleten"          → défaut
#
# Un terme préfixé par "re:" est une expression régulière brute (utile pour
# les mots composés néerlandais : schadewagen, carrosserieschade…).
#
# Les marqueurs et les négations sont GLOBAUX : une formulation de panne
# apprise une fois vaut pour tous les organes.

version: 2

# ── Marqueurs de PANNE ──────────────────────────────────────
# Relevés dans la base réelle (nombre d'occurrences en commentaire).
# Rendent un composant fautif s'ils apparaissent dans la même proposition.
fault_markers:
