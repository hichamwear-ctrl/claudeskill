<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none" role="img" aria-label="Soins et coupe">
  <defs>
    <linearGradient id="ggold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8CE7B"/><stop offset="1" stop-color="#B8942A"/>
    </linearGradient>
    <radialGradient id="gglow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#D4AF37" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="#101010"/>
  <rect width="600" height="600" fill="url(#gglow)"/>
  <!-- comb -->
  <g transform="translate(150 150) rotate(20)">
    <rect x="0" y="0" width="220" height="46" rx="10" fill="#1d1d1d" stroke="url(#ggold)" stroke-width="2"/>
    <g stroke="url(#ggold)" stroke-width="4">
      <line x1="16" y1="46" x2="16" y2="92"/><line x1="40" y1="46" x2="40" y2="92"/>
      <line x1="64" y1="46" x2="64" y2="92"/><line x1="88" y1="46" x2="88" y2="92"/>
      <line x1="112" y1="46" x2="112" y2="92"/><line x1="136" y1="46" x2="136" y2="92"/>
      <line x1="160" y1="46" x2="160" y2="92"/><line x1="184" y1="46" x2="184" y2="92"/>
      <line x1="204" y1="46" x2="204" y2="92"/>
    </g>
  </g>
  <!-- razor -->
  <g transform="translate(150 360) rotate(-12)">
    <rect x="0" y="0" width="260" height="18" rx="9" fill="url(#ggold)"/>
    <rect x="-10" y="-6" width="34" height="30" rx="6" fill="#242424" stroke="url(#ggold)" stroke-width="2"/>
  </g>
  <circle cx="300" cy="300" r="230" fill="none" stroke="url(#ggold)" stroke-width="1.5" opacity="0.2"/>
</svg>
