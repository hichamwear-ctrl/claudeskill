<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" role="img" aria-label="Barbershop premium">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141414"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8CE7B"/>
      <stop offset="0.5" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#B8942A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#D4AF37" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>
  <!-- mirror -->
  <rect x="300" y="70" width="200" height="260" rx="100" fill="#0d0d0d" stroke="url(#gold)" stroke-width="4"/>
  <rect x="316" y="86" width="168" height="228" rx="84" fill="#171717"/>
  <!-- hanging bulbs -->
  <g stroke="#3a3a3a" stroke-width="2">
    <line x1="140" y1="40" x2="140" y2="150"/><line x1="660" y1="40" x2="660" y2="150"/>
  </g>
  <circle cx="140" cy="165" r="16" fill="url(#gold)" opacity="0.85"/>
  <circle cx="660" cy="165" r="16" fill="url(#gold)" opacity="0.85"/>
  <circle cx="140" cy="165" r="30" fill="url(#glow)"/>
  <circle cx="660" cy="165" r="30" fill="url(#glow)"/>
  <!-- barber chair -->
  <g>
    <rect x="330" y="360" width="140" height="120" rx="18" fill="#1c1c1c" stroke="#2a2a2a" stroke-width="2"/>
    <rect x="350" y="330" width="100" height="60" rx="16" fill="#232323"/>
    <rect x="380" y="480" width="40" height="70" fill="#161616"/>
    <ellipse cx="400" cy="560" rx="70" ry="14" fill="#101010"/>
  </g>
  <!-- razor -->
  <g transform="rotate(-24 560 430)">
    <rect x="520" y="424" width="120" height="12" rx="6" fill="url(#gold)"/>
    <rect x="516" y="420" width="20" height="20" rx="4" fill="#2a2a2a"/>
  </g>
  <!-- scissors motif -->
  <g stroke="url(#gold)" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9" transform="translate(150 380)">
    <circle cx="8" cy="8" r="10"/><circle cx="8" cy="52" r="10"/>
    <path d="M18 12 L90 34 M18 48 L90 26"/>
  </g>
</svg>
