name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders — no live database is contacted (Prisma only
      # generates the client; all DB-backed pages are dynamic/runtime).
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/barberhome?schema=public"
      AUTH_SECRET: "ci-placeholder-secret-not-used-at-runtime-000000000000"
      AUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
